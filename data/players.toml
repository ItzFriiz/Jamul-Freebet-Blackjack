# The computer players who can occupy the other seats (RULES.md R2.16).
#
# Nothing here is hard-coded anywhere; add, remove or rewrite a character by
# editing this file. Each one needs every field below --
# scripts/check_content.py checks that.
#
# Fields
#   bio          one or two sentences, shown when they sit down
#   bet_units    base bet as a multiple of the table minimum
#   spread       how much they vary that bet, 0 = always the same
#   side_bets    "none" | "rare" | "sometimes" | "always"
#   tips         "never" | "rare" | "sometimes" | "often"
#   toke_bets    whether they ever bet on the dealer's behalf
#   play         "basic" | "cautious" | "aggressive" | "superstitious" | "mimic"
#   agreeable    0.0 - 1.0, how likely they are to give up a seat when asked (R2.19)
#   buy_in       what they sit down with, in dollars

[[player]]
name = "Ernie"
bio = "Retired postal inspector. Plays the same twenty-five dollars every hand and has opinions about people who don't."
bet_units = 1
spread = 0
side_bets = "none"
tips = "rare"
toke_bets = false
play = "basic"
agreeable = 0.3
buy_in = 400

