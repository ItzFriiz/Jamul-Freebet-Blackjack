# What the dealer says, grouped by the moment that triggers it.
#
# Nothing here touches the rules -- it is pure flavour. One line is picked at
# random per event so a long session does not sound like a recording.
#
# Write whatever you like. {name} is filled in with the dealer's name; anything
# else in braces is printed as written, and even an unbalanced brace just shows
# up as text. Nothing here can break a hand, and nothing checks your prose.
#
# Adding a line is just adding a string. Adding a *group* means teaching the code
# when to fire it, so the group names below are the ones the code knows about;
# scripts/check_content.py will say so if one goes missing.

# --- Coming and going (R2.14) ---------------------------------------------
